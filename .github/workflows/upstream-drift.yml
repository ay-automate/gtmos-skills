name: upstream-drift

# Monthly check of every pinned upstream source (see CONTRIBUTING.md, "Monthly refresh"). Read-only: it never
# refreshes anything; a maintainer runs the refresh and opens the pull request.
on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare pins with upstream HEAD
        run: |
          set +e
          node scripts/skills.mjs upstream check > drift.txt 2>&1
          status=$?
          { echo '## Upstream drift'; echo; echo '```'; cat drift.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat drift.txt
          exit $status
