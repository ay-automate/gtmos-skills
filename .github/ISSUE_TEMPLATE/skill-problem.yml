name: Skill problem
description: A skill gives wrong or outdated advice, names an operation that does not exist, or does not trigger.
labels: [bug]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: gtmos-outreach-cold-email
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Used with
      options: [GTM OS connected, Without GTM OS]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Claude Code 2.x, Codex, ...
